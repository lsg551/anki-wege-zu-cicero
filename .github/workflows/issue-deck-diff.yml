name: Deck diff from issue

# When an issue carries an .apkg (renamed to .zip, which GitHub accepts), the
# ack job says the bot is working, the parse job compares it with dump/, and
# the comment job edits the ack into the result. The parse job handles
# untrusted input and holds no write token. The branches live in
# scripts/issue_deck.py, which is unit tested.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: issue-diff-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ack:
    if: >-
      github.event.action == 'opened' &&
      (contains(github.event.issue.body || '', 'user-attachments') ||
       contains(github.event.issue.body || '', '.zip') ||
       contains(github.event.issue.body || '', '.apkg'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Comment that the bot is working
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python3 scripts/issue_deck.py ack > "$RUNNER_TEMP/ack.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/ack.md"

  parse:
    if: >-
      contains(github.event.issue.body || '', 'user-attachments') ||
      contains(github.event.issue.body || '', '.zip') ||
      contains(github.event.issue.body || '', '.apkg')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Compare the attachment with the dump
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.txt"
          uv run python scripts/issue_deck.py parse-diff \
            "$RUNNER_TEMP/body.txt" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deck-diff
          retention-days: 45
          path: |
            ${{ runner.temp }}/diff.txt
            ${{ runner.temp }}/error.txt
            ${{ runner.temp }}/code.txt

  comment:
    needs: parse
    if: needs.parse.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deck-diff
      - name: Post the diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          code=$(cat "$(find . -name code.txt -print -quit)")
          diff=$(find . -name diff.txt -print -quit)
          err=$(find . -name error.txt -print -quit)
          python3 scripts/issue_deck.py post \
            "$code" "$diff" "$err" "$ISSUE" "$REPO" "$RUN_ID"
