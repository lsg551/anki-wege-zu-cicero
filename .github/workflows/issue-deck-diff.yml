name: Deck diff from issue

# When an issue carries an .apkg, dump it and comment the diff against dump/.
# The parse job parses untrusted input and holds no write token; the comment
# job only posts text produced by the parse job.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: issue-diff-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  parse:
    if: contains(github.event.issue.body || '', '.apkg')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Download the attached package
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          url=$(printf '%s' "$BODY" \
            | grep -oE 'https?://[^ )"]+' \
            | grep -E 'user-attachments|\.apkg' \
            | head -n 1 || true)
          if [ -z "$url" ]; then
            echo "no .apkg link found in the issue body" >&2
            exit 1
          fi
          curl -fsSL "$url" -o "$RUNNER_TEMP/issue.apkg"
          test -s "$RUNNER_TEMP/issue.apkg"
      - name: Diff the package against the dump
        run: |
          set +e
          uv run anki-tools diff dump "$RUNNER_TEMP/issue.apkg" \
            --with-deck-configs --no-media \
            > "$RUNNER_TEMP/diff.txt" 2> "$RUNNER_TEMP/error.txt"
          echo "$?" > "$RUNNER_TEMP/code.txt"
          set -e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deck-diff
          retention-days: 3
          path: |
            ${{ runner.temp }}/diff.txt
            ${{ runner.temp }}/error.txt
            ${{ runner.temp }}/code.txt

  comment:
    needs: parse
    if: needs.parse.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deck-diff
      - name: Post the diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          code=$(cat "$(find . -name code.txt -print -quit)")
          diff=$(find . -name diff.txt -print -quit)
          err=$(find . -name error.txt -print -quit)
          {
            echo '<!-- anki-tools-diff -->'
            echo '### Deck-Vorschlag'
            echo
            case "$code" in
              0)
                echo 'Der angehängte Export ist inhaltsgleich mit <code>dump/</code> (keine Änderungen).'
                ;;
              1)
                echo '<details><summary>Änderungen gegenüber <code>dump/</code></summary>'
                echo
                echo '```diff'
                if [ "$(wc -c < "$diff")" -gt 60000 ]; then
                  head -c 60000 "$diff"
                  echo
                  echo "... gekürzt, vollständiger Diff: $RUN_URL"
                else
                  cat "$diff"
                fi
                echo '```'
                echo
                echo '</details>'
                ;;
              *)
                echo 'Der Export konnte nicht verglichen werden:'
                echo
                echo '```'
                head -c 4000 "$err"
                echo '```'
                ;;
            esac
          } > body.md

          # Update the previous bot comment if there is one, else create it.
          id=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- anki-tools-diff -->")) | .id' \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api "repos/$REPO/issues/$ISSUE/comments" -F body=@body.md > /dev/null
          fi
