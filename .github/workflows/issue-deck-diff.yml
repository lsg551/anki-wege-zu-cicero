name: Deck diff from issue

# When an issue carries an .apkg (renamed to .zip, which GitHub accepts), the
# parse job compares it with dump/ and writes the comment body; the comment job
# only posts that text. The parse job handles untrusted input and holds no write
# token. The branches live in scripts/issue_deck.py, which is unit tested.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: issue-diff-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  parse:
    if: >-
      contains(github.event.issue.body || '', 'user-attachments') ||
      contains(github.event.issue.body || '', '.zip') ||
      contains(github.event.issue.body || '', '.apkg')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Compare the attachment with the dump
        env:
          BODY: ${{ github.event.issue.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.txt"
          uv run python scripts/issue_deck.py parse-diff \
            "$RUNNER_TEMP/body.txt" "$RUNNER_TEMP" "$RUN_URL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deck-diff
          retention-days: 3
          path: |
            ${{ runner.temp }}/diff.txt
            ${{ runner.temp }}/error.txt
            ${{ runner.temp }}/code.txt
            ${{ runner.temp }}/body.md

  comment:
    needs: parse
    if: needs.parse.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deck-diff
      - name: Post the diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          body=$(find . -name body.md -print -quit)
          id=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- anki-tools-diff -->")) | .id' \
            | head -n 1 || true)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" \
              -F "body=@$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$ISSUE/comments" \
              -F "body=@$body" > /dev/null
          fi
