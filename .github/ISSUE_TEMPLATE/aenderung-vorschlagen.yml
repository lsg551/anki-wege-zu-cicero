name: Änderung oder Korrektur vorschlagen
description: Schlage eine Korrektur oder Ergänzung für das Deck vor
title: "[Änderung] "
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du hilfst! Exportiere bitte zuerst dein Deck aus Anki und hänge die Datei unten an.

        1. In Anki das Deck **Latein** anklicken.
        2. Auf das Zahnrad klicken: **Export**.
        3. Diese Einstellungen übernehmen:
           - *Export format*: `Anki Deck Package (.apkg)`
           - *Include*: `Latein`
           - Option **Include deck presets** einschalten (Medien sind optional).
        4. Auf **Export…** klicken.
        5. Die Datei umbenennen, sodass sie zusätzlich auf `.zip` endet: `anki-wege-zu-cicero.apkg` → `anki-wege-zu-cicero.apkg.zip`. (GitHub akzeptiert keine `.apkg`-Dateien.)
        6. Die umbenannte Datei unten in das Feld **Exportierte Datei** ziehen (Drag & Drop).
  - type: textarea
    id: beschreibung
    attributes:
      label: Was hast du geändert?
      description: Beschreibe kurz die Korrekturen oder Ergänzungen.
      placeholder: z.B. "Bedeutung von advocō korrigiert"
    validations:
      required: true
  - type: textarea
    id: datei
    attributes:
      label: Exportierte Datei (.zip)
      description: Ziehe die in `.zip` umbenannte Datei hier hinein (Drag & Drop).
      placeholder: Datei hier ablegen
    validations:
      required: true
  - type: checkboxes
    id: export
    attributes:
      label: Export
      options:
        - label: Ich habe die exportierte Datei auf `.zip` umbenannt und angehängt.
          required: true
