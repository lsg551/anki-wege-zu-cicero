[project]
name = "anki-wege-zu-cicero"
dynamic = ["version"]
description = "Anki-Karteikarten zu Wege zu Cicero (Per Aspera ad Astra)"
readme = "README.md"
authors = [
    { name = "Luis Schulte", email = "git@luisschulte.com" }
]
requires-python = ">=3.13"
# Pinned to the attested release wheel: the same artifact users install.
# Bump by editing the URL, then run `uv lock`.
dependencies = [
    "anki-tools @ https://github.com/lsg551/anki-tools/releases/download/v0.1.0-beta.2/anki_tools-0.1.0b2-py3-none-any.whl",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",   # builtins shadowing
    "ANN", # annotations
    "B",   # bugbear
    "C4",  # comprehensions
    "D",   # docstrings
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PTH", # pathlib
    "RET", # return
    "RUF", # ruff
    "SIM", # simplify
    "UP",  # pyupgrade
]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ty.rules]
all = "error"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config --cov=scripts --cov-report=term-missing"

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
show_missing = true

